# Blueprint de Render: sitio Django + base de datos PostgreSQL.
# En Render: New → Blueprint → elige este repositorio.
services:
  - type: web
    name: billares-guayabal
    runtime: python
    plan: free
    region: oregon
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /robots.txt
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true          # Render genera una clave aleatoria
      - key: DATABASE_URL
        fromDatabase:
          name: billares-guayabal-db
          property: connectionString
      - key: SITE_URL
        sync: false                  # p. ej. https://billares-guayabal.onrender.com
      - key: DJANGO_ALLOWED_HOSTS
        sync: false                  # dominio propio, si lo hay (el de onrender.com se agrega solo)
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false                  # la escribes tú en Render; nunca en el código

databases:
  - name: billares-guayabal-db
    plan: free
    region: oregon
    databaseName: billares
    user: billares
